name: Release

# Тег v1.0.0 → подписанные AAB (для Google Play и RuStore) и APK в GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи из секретов
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
      - name: Сборка
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ranepa-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ranepa-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" "ranepa-${GITHUB_REF_NAME}.apk" "ranepa-${GITHUB_REF_NAME}.aab" --generate-notes
