name: Release

# Тег v1.0.0 → подписанные AAB (для Google Play) и APK в GitHub Releases и новая
# версия в RuStore на модерацию. ranepa.apk — то же APK под постоянным именем: на
# него ведёт «Обновить» в приложении (releases/latest/download/ranepa.apk). Текст
# «Что нового» для RuStore — сообщение тега: git tag -a v1.2.0 -m "…".
# Дальше — update.json, см. docs/release.md.
#
# Тег v1.2.0-alpha.1 → только пре-релиз на GitHub (без ranepa.apk: «последним» он
# не становится), в RuStore ничего не уходит.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ALPHA: ${{ contains(github.ref_name, '-alpha') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Ключ подписи из секретов
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
      - name: Сборка
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Перезапуск после ошибки в RuStore: релиз уже есть.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          cp app/build/outputs/apk/release/app-release.apk "ranepa-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ranepa-${GITHUB_REF_NAME}.aab"
          if [ "$ALPHA" = true ]; then
            gh release create "$GITHUB_REF_NAME" "ranepa-${GITHUB_REF_NAME}.apk" "ranepa-${GITHUB_REF_NAME}.aab" --prerelease --generate-notes
          else
            cp app/build/outputs/apk/release/app-release.apk ranepa.apk
            gh release create "$GITHUB_REF_NAME" "ranepa-${GITHUB_REF_NAME}.apk" ranepa.apk "ranepa-${GITHUB_REF_NAME}.aab" --generate-notes
          fi
      - name: Версия в RuStore
        if: env.ALPHA != 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: |
          # Сообщение есть только у аннотированного тега; у простого — текст по умолчанию.
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          notes=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(if)%(*objectname)%(then)%(contents)%(end)')
          scripts/rustore-release.sh app/build/outputs/apk/release/app-release.apk "${notes:-Версия ${GITHUB_REF_NAME#v}}"
